<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WG Busy - WireGuard Manager</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/handlebars@4.7.8/dist/handlebars.min.js"></script>
</head>

<body>
    <main class="container">
        <hgroup class="flex-row app-header">
            <div>
                <h1>WG Busy</h1>
                <p>WireGuard Server Manager <span class="app-version">(<span hx-get="version" hx-trigger="templates-ready from:body" hx-swap="innerHTML">dev</span>)</span></p>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem;">
                <button id="logout-btn" class="btn btn-outline secondary" style="display:none; padding: 0.25rem 0.65rem; font-size: 0.85em;" onclick="handleLogout()" title="Log Out">Log Out</button>
                <button class="btn btn-outline secondary theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </hgroup>

        <input type="hidden" id="active-stats-kind" name="kind" value="peers">
        <div id="stats-bar" class="stats-bar" hx-get="stats" hx-include="#active-stats-kind"
             hx-trigger="templates-ready from:body, stats-refresh"
             hx-swap="innerHTML">
        </div>

        <div class="tabs" role="tablist">
            <button role="tab" class="active" data-stats-kind="peers" hx-get="peers" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                Peers
            </button>
            <button role="tab" data-stats-kind="server" hx-get="server" hx-target="#tab-content" hx-swap="innerHTML" onclick="selectTab(this)">
                Server
            </button>
            <button id="tab-bgp" role="tab" data-stats-kind="bgp" hx-get="bgp/stats" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                BGP
            </button>
            <button id="tab-zerotier" role="tab" data-stats-kind="zerotier" hx-get="zerotier" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                ZeroTier
            </button>
        </div>

        <div id="tab-content" hx-get="peers" hx-trigger="templates-ready from:body" hx-swap="innerHTML">
        </div>

        <div id="modal-container"></div>
    </main>

    <!-- popover puts toasts in the top layer, so they stay readable over an open modal. -->
    <div id="toast-container" class="toast-container" popover="manual" aria-live="polite"></div>

    <script>
        // URL query parameters support
        var urlParams = new URLSearchParams(window.location.search);
        var initialTheme = urlParams.get('theme');

        // Theme toggling
        function initTheme() {
            if (initialTheme === 'dark' || initialTheme === 'light') {
                document.documentElement.setAttribute('data-theme', initialTheme);
                return;
            }
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        initTheme();

        // Initial tab routing via query parameter (?tab=server|bgp|zerotier)
        var targetTab = urlParams.get('tab');
        if (targetTab) {
            var tabBtn = document.querySelector('.tabs button[data-stats-kind="' + targetTab + '"]');
            if (tabBtn) {
                document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
                tabBtn.classList.add('active');
                document.getElementById('active-stats-kind').value = targetTab;
                var tabContent = document.getElementById('tab-content');
                tabContent.setAttribute('hx-get', tabBtn.getAttribute('hx-get'));
            }
        }

        if (urlParams.get('modal') === 'bgp-peer') {
            document.body.addEventListener('templates-ready', function () {
                setTimeout(function () {
                    htmx.ajax('GET', 'bgp/peers/new', { target: '#modal-container', swap: 'innerHTML' });
                }, 100);
            });
        }

        function copyText(text, btn) {
            if (!navigator.clipboard) return;
            navigator.clipboard.writeText(text).then(function() {
                if (!btn) return;
                var origText = btn.getAttribute('data-tooltip') || btn.title || '';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(function(err) {
                console.error('Failed to copy text: ', err);
            });
        }

        function selectTab(btn) {
            document.querySelectorAll('.tabs button').forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            document.getElementById('active-stats-kind').value = btn.dataset.statsKind;

            if (btn.dataset.statsKind !== 'zerotier' && activeZtXhr) {
                activeZtXhr._abortedForUnfocus = true;
                activeZtXhr.abort();
                activeZtXhr = null;
                ztRepollPending = false;
            }
        }

        // Energy-saving page lifecycle & focus management
        // Halts all polling, network activity, long polls, and CSS animations when the page is not in focus.
        var statsTimer = null;
        var activeZtXhr = null;
        var ztRepollPending = false;
        var templatesLoaded = false;

        function isPageActive() {
            return document.visibilityState === 'visible' && (typeof document.hasFocus !== 'function' || document.hasFocus());
        }

        function triggerStatsPoll() {
            if (!isPageActive() || !templatesLoaded) return;
            var statsBar = document.getElementById('stats-bar');
            if (statsBar) {
                htmx.trigger(statsBar, 'stats-refresh');
            }
        }

        function startStatsPolling() {
            if (statsTimer) return;
            triggerStatsPoll();
            statsTimer = setInterval(triggerStatsPoll, 2000);
        }

        function stopStatsPolling() {
            if (statsTimer) {
                clearInterval(statsTimer);
                statsTimer = null;
            }
        }

        function updateActivityState() {
            var active = isPageActive();
            document.documentElement.classList.toggle('page-unfocused', !active);

            if (active) {
                if (templatesLoaded) {
                    startStatsPolling();
                    var ztStatus = document.getElementById('zerotier-status');
                    if (ztStatus && (ztRepollPending || !activeZtXhr)) {
                        ztRepollPending = false;
                        htmx.trigger(document.body, 'zerotier-repoll');
                    }
                }
            } else {
                stopStatsPolling();
                if (activeZtXhr) {
                    activeZtXhr._abortedForUnfocus = true;
                    activeZtXhr.abort();
                    activeZtXhr = null;
                    ztRepollPending = true;
                }
            }
        }

        window.addEventListener('focus', updateActivityState);
        window.addEventListener('blur', updateActivityState);
        document.addEventListener('visibilitychange', updateActivityState);
        window.addEventListener('pageshow', updateActivityState);
        window.addEventListener('pagehide', updateActivityState);

        document.body.addEventListener('htmx:beforeRequest', function (evt) {
            var path = (evt.detail.requestConfig && evt.detail.requestConfig.path) || '';
            var target = evt.detail.target;
            var isZtStatus = (target && target.id === 'zerotier-status') || path.indexOf('zerotier/status') !== -1;
            var isStatsPoll = (target && target.id === 'stats-bar') || path.indexOf('stats') === 0;

            // Block automated background polling if page is not active
            if (!isPageActive() && (isZtStatus || isStatsPoll)) {
                if (isZtStatus) {
                    ztRepollPending = true;
                }
                evt.preventDefault();
                return;
            }

            if (isZtStatus) {
                activeZtXhr = evt.detail.xhr;
            }
        });

        document.body.addEventListener('htmx:afterRequest', function (evt) {
            if (activeZtXhr && evt.detail.xhr === activeZtXhr) {
                activeZtXhr = null;
            }
        });

        var renderPageResponse;

        // Every page endpoint returns {Template, Data, Toast}. HTMX owns the
        // request/swap lifecycle; Handlebars turns that JSON envelope into the
        // fragment HTMX swaps, including out-of-band peer and toast updates.
        document.body.addEventListener('htmx:beforeSwap', function (evt) {
            var xhr = evt.detail.xhr;
            var contentType = xhr.getResponseHeader('Content-Type') || '';
            if (contentType.indexOf('application/json') === 0) {
                try {
                    var payload = JSON.parse(xhr.responseText);
                    if (payload.Template === 'empty' && xhr.status >= 400) {
                        showToast(payload.Data && payload.Data.Error ? payload.Data.Error : 'Request failed');
                        evt.detail.shouldSwap = false;
                        evt.detail.isError = false;
                        return;
                    }
                    evt.detail.serverResponse = renderPageResponse(payload);
                } catch (err) {
                    showToast('Could not render the server response: ' + err.message);
                    evt.detail.shouldSwap = false;
                    evt.detail.isError = false;
                    return;
                }
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }

            // The active-tab stats response refreshes this fragment every 2s.
            // Without this, an open
            // "Received/Advertised routes" panel would fold itself shut (and any
            // "Show All Routes" click would un-expand) on every single tick.
            if (evt.detail.target && (evt.detail.target.id === 'bgp-live-stats' || evt.detail.target.id === 'stats-bar')) {
                var bgpStats = document.getElementById('bgp-live-stats');
                bgpRouteUIState = {};
                if (bgpStats) bgpStats.querySelectorAll('details[data-route-key]').forEach(function (d) {
                    bgpRouteUIState[d.dataset.routeKey] = { open: d.open, showAll: d.dataset.showAll === '1' };
                });
            }
        });

        var bgpRouteUIState = {};

        function showToast(msg) {
            var container = document.getElementById('toast-container');
            var el = document.createElement('div');
            el.className = 'toast toast-error';
            el.setAttribute('role', 'alert');
            el.textContent = msg;
            container.appendChild(el);
            if (container.showPopover && !container.matches(':popover-open')) {
                container.showPopover();
            }
            setTimeout(function () {
                el.remove();
                if (!container.children.length && container.matches(':popover-open')) {
                    container.hidePopover();
                }
            }, 8000);
        }

        document.body.addEventListener('htmx:responseError', function (evt) {
            var xhr = evt.detail.xhr;
            if (xhr && xhr._abortedForUnfocus) return;
            var body = (xhr.responseText || '').trim();
            // Only plain-text bodies (http.Error) are safe/useful to show verbatim.
            var isText = (xhr.getResponseHeader('Content-Type') || '').indexOf('text/plain') === 0;
            showToast(isText && body ? body : 'Request failed (' + xhr.status + ' ' + xhr.statusText + ')');
        });

        document.body.addEventListener('htmx:sendError', function (evt) {
            var xhr = evt && evt.detail && evt.detail.xhr;
            if (xhr && xhr._abortedForUnfocus) return;
            showToast('Could not reach the server. Check your connection.');
        });

        document.body.addEventListener('htmx:afterSwap', function (evt) {
            if (evt.detail.target.id === 'modal-container') {
                var dialog = evt.detail.target.querySelector('dialog');
                if (dialog && !dialog.open) {
                    dialog.showModal();
                }
            }

            if (evt.detail.target.id === 'bgp-live-stats' || evt.detail.target.id === 'stats-bar') {
                var bgpStats = document.getElementById('bgp-live-stats');
                if (bgpStats) bgpStats.querySelectorAll('details[data-route-key]').forEach(function (d) {
                    var state = bgpRouteUIState[d.dataset.routeKey];
                    if (!state) return;
                    if (state.open) d.open = true;
                    if (state.showAll) {
                        var btn = d.querySelector('.show-all-btn');
                        if (btn) showAllRoutes(btn);
                    }
                });
            }

            var toastContainer = document.getElementById('toast-container');
            if (toastContainer.children.length && toastContainer.showPopover && !toastContainer.matches(':popover-open')) {
                toastContainer.showPopover();
            }

            if (urlParams.get('unfold') === '1') {
                document.querySelectorAll('details').forEach(function (d) { d.open = true; });
            }
        });

        function closeModal() {
            var container = document.getElementById('modal-container');
            var dialog = container.querySelector('dialog');
            if (dialog) {
                dialog.close();
            }
            container.innerHTML = '';
        }

        function toggleExitNodeFields(checkbox) {
            var routeVia = document.getElementById('route-via-field');
            var exitConfig = document.getElementById('exit-node-config');

            if (routeVia) {
                routeVia.style.display = checkbox.checked ? 'none' : '';
            }
            if (exitConfig) {
                exitConfig.style.display = checkbox.checked ? '' : 'none';
            }
        }

        function toggleExitNodeRoutes(checkbox) {
            var routesField = document.getElementById('exit-node-routes-field');
            if (routesField) {
                routesField.style.display = checkbox.checked ? 'none' : '';
            }
        }

        function showAllRoutes(btn) {
            btn.style.display = 'none';
            var details = btn.closest('details');
            details.dataset.showAll = '1'; // survives the next poll swap, see htmx:beforeSwap/afterSwap above
            details.querySelectorAll('.hidden-route').forEach(function (row) {
                row.classList.remove('hidden-route');
            });
        }

        // containerId/namePrefix let the same form host two independent filter
        // lists (received vs. advertised prefixes) without their rows colliding.
        function addRouteFilterRow(containerId, namePrefix) {
            containerId = containerId || 'bgp-route-filters-list';
            namePrefix = namePrefix || 'filter';
            var list = document.getElementById(containerId);
            if (!list) return;

            var rowTemplate = Handlebars.compile(document.getElementById('route-filter-row-template').textContent);
            list.insertAdjacentHTML('beforeend', rowTemplate({ NamePrefix: namePrefix }));
        }

        function registerHandlebars() {
            Handlebars.registerHelper('eq', function (a, b) { return a === b; });
            Handlebars.registerHelper('ne', function (a, b) { return a !== b; });
            Handlebars.registerHelper('gt', function (a, b) { return a > b; });
            Handlebars.registerHelper('and', function () {
                return Array.prototype.slice.call(arguments, 0, -1).every(Boolean);
            });
            Handlebars.registerHelper('or', function () {
                return Array.prototype.slice.call(arguments, 0, -1).some(Boolean);
            });
            Handlebars.registerHelper('not', function (value) { return !value; });
            Handlebars.registerHelper('len', function (value) { return value ? value.length : 0; });
            Handlebars.registerHelper('hasField', function (errors, field) {
                return Array.isArray(errors) && errors.some(function (item) { return item.Field === field; });
            });
            Handlebars.registerHelper('formatTime', function (value) {
                if (!value || value.indexOf('0001-01-01') === 0) return '';
                return value.slice(0, 10);
            });

            document.querySelectorAll('#handlebars-templates script[id$="-template"]').forEach(function (node) {
                Handlebars.registerPartial(node.id.slice(0, -9), node.textContent);
            });
            renderPageResponse = Handlebars.compile(document.getElementById('page-template').textContent);
        }

        // Base64URL encoding & decoding helpers for WebAuthn
        function bufferToBase64URL(buffer) {
            var bytes = new Uint8Array(buffer);
            var str = '';
            for (var i = 0; i < bytes.byteLength; i++) {
                str += String.fromCharCode(bytes[i]);
            }
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function base64URLToBuffer(base64url) {
            var base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
            while (base64.length % 4) {
                base64 += '=';
            }
            var binary = atob(base64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // Passkey & Auth State Management
        function checkAuthAndPasskeys() {
            fetch('api/auth/status')
                .then(function (res) { return res.json(); })
                .then(function (status) {
                    var logoutBtn = document.getElementById('logout-btn');
                    if (logoutBtn) {
                        logoutBtn.style.display = (status.requirePasskey && status.hasPasskeys && status.authenticated) ? 'inline-block' : 'none';
                    }

                    // If not authenticated and passkey login is required, show login card
                    if (status.requirePasskey && status.hasPasskeys && !status.authenticated) {
                        var tabContent = document.getElementById('tab-content');
                        var loginTmpl = Handlebars.compile(document.getElementById('login-card-template').textContent);
                        if (tabContent && loginTmpl) {
                            tabContent.innerHTML = loginTmpl({});
                        }
                        var statsBar = document.getElementById('stats-bar');
                        if (statsBar) statsBar.style.display = 'none';
                        var tabs = document.querySelector('.tabs');
                        if (tabs) tabs.style.display = 'none';
                        return;
                    } else {
                        var statsBar = document.getElementById('stats-bar');
                        if (statsBar) statsBar.style.display = '';
                        var tabs = document.querySelector('.tabs');
                        if (tabs) tabs.style.display = '';
                    }

                    // If no passkeys configured, prompt user up to 3 times
                    if (!status.hasPasskeys) {
                        var count = parseInt(localStorage.getItem('wg_passkey_prompt_count') || '0', 10);
                        if (count < 3) {
                            var container = document.getElementById('modal-container');
                            if (container && !container.querySelector('dialog')) {
                                var promptTmpl = Handlebars.compile(document.getElementById('passkey-prompt-modal-template').textContent);
                                container.innerHTML = promptTmpl({});
                                var dialog = container.querySelector('dialog');
                                if (dialog) dialog.showModal();
                            }
                        }
                    }
                })
                .catch(function (err) {
                    console.error('Failed to check auth status:', err);
                });
        }

        function dismissPasskeyPrompt(never) {
            if (never) {
                localStorage.setItem('wg_passkey_prompt_count', '3');
            } else {
                var count = parseInt(localStorage.getItem('wg_passkey_prompt_count') || '0', 10);
                localStorage.setItem('wg_passkey_prompt_count', (count + 1).toString());
            }
            closeModal();
        }

        function openAddPasskeyModal() {
            closeModal();
            var defaultName = 'Admin Passkey';
            if (navigator.userAgent.indexOf('Macintosh') !== -1) defaultName = 'MacBook Touch ID';
            else if (navigator.userAgent.indexOf('Windows') !== -1) defaultName = 'Windows Hello';
            else if (navigator.userAgent.indexOf('iPhone') !== -1 || navigator.userAgent.indexOf('iPad') !== -1) defaultName = 'Apple Passkey';
            else if (navigator.userAgent.indexOf('Android') !== -1) defaultName = 'Android Passkey';

            var container = document.getElementById('modal-container');
            var addTmpl = Handlebars.compile(document.getElementById('passkey-add-modal-template').textContent);
            container.innerHTML = addTmpl({ DefaultName: defaultName });
            var dialog = container.querySelector('dialog');
            if (dialog) dialog.showModal();
            var input = document.getElementById('passkey-name-input');
            if (input) input.focus();
        }

        function submitPasskeyRegistration(event, form) {
            event.preventDefault();
            var nameInput = document.getElementById('passkey-name-input');
            var name = (nameInput && nameInput.value) ? nameInput.value.trim() : 'Admin Passkey';
            var errEl = document.getElementById('passkey-reg-error');
            var submitBtn = document.getElementById('passkey-reg-submit-btn');

            if (errEl) errEl.style.display = 'none';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Prompting device...';
            }

            fetch('api/auth/passkeys/begin', { method: 'POST' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (options) {
                    options.challenge = base64URLToBuffer(options.challenge);
                    options.user.id = base64URLToBuffer(options.user.id);
                    if (options.excludeCredentials) {
                        options.excludeCredentials.forEach(function (c) {
                            c.id = base64URLToBuffer(c.id);
                        });
                    }
                    return navigator.credentials.create({ publicKey: options });
                })
                .then(function (credential) {
                    var payload = {
                        name: name,
                        id: credential.id,
                        rawId: bufferToBase64URL(credential.rawId),
                        type: credential.type,
                        response: {
                            clientDataJSON: bufferToBase64URL(credential.response.clientDataJSON),
                            attestationObject: bufferToBase64URL(credential.response.attestationObject)
                        }
                    };
                    return fetch('api/auth/passkeys/finish', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                })
                .then(function (res) {
                    if (!res.ok) {
                        return res.text().then(function (t) { throw new Error(t || 'Failed to save passkey'); });
                    }
                    return res.json();
                })
                .then(function (data) {
                    closeModal();
                    showToast('Passkey "' + name + '" registered successfully.');
                    localStorage.setItem('wg_passkey_prompt_count', '3');
                    var activeTab = document.querySelector('.tabs button.active');
                    if (activeTab && activeTab.dataset.statsKind === 'server') {
                        htmx.ajax('GET', 'server', { target: '#tab-content', swap: 'innerHTML' });
                    }
                    checkAuthAndPasskeys();
                })
                .catch(function (err) {
                    if (errEl) {
                        errEl.textContent = err.message || 'Passkey registration cancelled or failed.';
                        errEl.style.display = 'block';
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Register Passkey';
                    }
                });
        }

        function handlePasskeyLogin() {
            var errEl = document.getElementById('login-error-msg');
            var btn = document.getElementById('login-btn');
            if (errEl) errEl.style.display = 'none';
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Prompting device...';
            }

            fetch('api/auth/login/begin', { method: 'POST' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (options) {
                    options.challenge = base64URLToBuffer(options.challenge);
                    if (options.allowCredentials) {
                        options.allowCredentials.forEach(function (c) {
                            c.id = base64URLToBuffer(c.id);
                        });
                    }
                    return navigator.credentials.get({ publicKey: options });
                })
                .then(function (assertion) {
                    var payload = {
                        id: assertion.id,
                        rawId: bufferToBase64URL(assertion.rawId),
                        type: assertion.type,
                        response: {
                            clientDataJSON: bufferToBase64URL(assertion.response.clientDataJSON),
                            authenticatorData: bufferToBase64URL(assertion.response.authenticatorData),
                            signature: bufferToBase64URL(assertion.response.signature),
                            userHandle: assertion.response.userHandle ? bufferToBase64URL(assertion.response.userHandle) : ''
                        }
                    };
                    return fetch('api/auth/login/finish', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                })
                .then(function (res) {
                    if (!res.ok) {
                        return res.text().then(function (t) { throw new Error(t || 'Authentication failed'); });
                    }
                    return res.json();
                })
                .then(function () {
                    showToast('Signed in successfully.');
                    var activeTab = document.querySelector('.tabs button.active') || document.querySelector('.tabs button[data-stats-kind="peers"]');
                    var getUrl = (activeTab && activeTab.getAttribute('hx-get')) || 'peers';
                    htmx.ajax('GET', getUrl, { target: '#tab-content', swap: 'innerHTML' });
                    checkAuthAndPasskeys();
                })
                .catch(function (err) {
                    if (errEl) {
                        errEl.textContent = err.message || 'Passkey authentication cancelled or failed.';
                        errEl.style.display = 'block';
                    }
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = 'Sign In with Passkey';
                    }
                });
        }

        function handleLogout() {
            fetch('api/auth/logout', { method: 'POST' })
                .then(function () {
                    showToast('Logged out.');
                    checkAuthAndPasskeys();
                })
                .catch(function (err) {
                    console.error('Logout error:', err);
                });
        }

        function deletePasskey(id, name) {
            if (!confirm('Delete passkey "' + name + '"?')) return;
            fetch('api/auth/passkeys/' + encodeURIComponent(id), { method: 'DELETE', headers: { 'HX-Request': 'true' } })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json().catch(function() { return {}; });
                })
                .then(function () {
                    showToast('Passkey "' + name + '" deleted.');
                    htmx.ajax('GET', 'server', { target: '#tab-content', swap: 'innerHTML' });
                    checkAuthAndPasskeys();
                })
                .catch(function (err) {
                    showToast('Failed to delete passkey: ' + err.message);
                });
        }

        fetch('templates.html').then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
        }).then(function (markup) {
            var host = document.createElement('div');
            host.id = 'handlebars-templates';
            host.hidden = true;
            host.innerHTML = markup;
            document.body.appendChild(host);
            registerHandlebars();
            templatesLoaded = true;
            setTimeout(function () {
                htmx.trigger(document.body, 'templates-ready');
                updateActivityState();
                checkAuthAndPasskeys();
            });
        }).catch(function (err) {
            showToast('Could not load UI templates: ' + err.message);
        });

    </script>
</body>

</html>
