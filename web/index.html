<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WG Busy - WireGuard Manager</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>
    <main class="container">
        <hgroup class="flex-row">
            <div>
                <h1>WG Busy</h1>
                <p>WireGuard Server Manager</p>
            </div>
            <button class="btn btn-outline secondary" onclick="toggleTheme()" id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </hgroup>

        <div id="stats-bar" class="stats-bar" hx-get="stats" hx-trigger="load, every 2s" hx-swap="innerHTML">
        </div>

        <div class="tabs" role="tablist">
            <button role="tab" class="active" hx-get="peers" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                Peers
            </button>
            <button role="tab" hx-get="server" hx-target="#tab-content" hx-swap="innerHTML" onclick="selectTab(this)">
                Server
            </button>
            <button id="tab-bgp" role="tab" hx-get="bgp/stats" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                BGP
            </button>
            <button id="tab-zerotier" role="tab" hx-get="zerotier" hx-target="#tab-content" hx-swap="innerHTML"
                onclick="selectTab(this)">
                ZeroTier
            </button>
        </div>

        <div id="tab-content" hx-get="peers" hx-trigger="load" hx-swap="innerHTML">
        </div>

        <div id="modal-container"></div>
    </main>

    <!-- popover puts toasts in the top layer, so they stay readable over an open modal. -->
    <div id="toast-container" class="toast-container" popover="manual" aria-live="polite"></div>

    <script>
        // Theme toggling
        function initTheme() {
            var saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }
        initTheme();

        function selectTab(btn) {
            document.querySelectorAll('.tabs button').forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');
        }

        // htmx discards non-2xx responses by default, which silently hid every
        // validation error. If the server rendered HTML for a failed request it is a
        // form with the errors in it, so swap it in; plain-text errors become a toast.
        document.body.addEventListener('htmx:beforeSwap', function (evt) {
            var xhr = evt.detail.xhr;
            if (xhr.status >= 400 && (xhr.getResponseHeader('Content-Type') || '').indexOf('text/html') === 0) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }

            // The BGP tab polls this fragment every 2s. Without this, an open
            // "Received/Advertised routes" panel would fold itself shut (and any
            // "Show All Routes" click would un-expand) on every single tick.
            if (evt.detail.target && evt.detail.target.id === 'bgp-live-stats') {
                bgpRouteUIState = {};
                evt.detail.target.querySelectorAll('details[data-route-key]').forEach(function (d) {
                    bgpRouteUIState[d.dataset.routeKey] = { open: d.open, showAll: d.dataset.showAll === '1' };
                });
            }
        });

        var bgpRouteUIState = {};

        function showToast(msg) {
            var container = document.getElementById('toast-container');
            var el = document.createElement('div');
            el.className = 'toast toast-error';
            el.setAttribute('role', 'alert');
            el.textContent = msg;
            container.appendChild(el);
            if (container.showPopover && !container.matches(':popover-open')) {
                container.showPopover();
            }
            setTimeout(function () {
                el.remove();
                if (!container.children.length && container.matches(':popover-open')) {
                    container.hidePopover();
                }
            }, 8000);
        }

        document.body.addEventListener('htmx:responseError', function (evt) {
            var xhr = evt.detail.xhr;
            var body = (xhr.responseText || '').trim();
            // Only plain-text bodies (http.Error) are safe/useful to show verbatim.
            var isText = (xhr.getResponseHeader('Content-Type') || '').indexOf('text/plain') === 0;
            showToast(isText && body ? body : 'Request failed (' + xhr.status + ' ' + xhr.statusText + ')');
        });

        document.body.addEventListener('htmx:sendError', function () {
            showToast('Could not reach the server. Check your connection.');
        });

        document.body.addEventListener('htmx:afterSwap', function (evt) {
            if (evt.detail.target.id === 'modal-container') {
                var dialog = evt.detail.target.querySelector('dialog');
                if (dialog && !dialog.open) {
                    dialog.showModal();
                }
            }

            if (evt.detail.target.id === 'bgp-live-stats') {
                evt.detail.target.querySelectorAll('details[data-route-key]').forEach(function (d) {
                    var state = bgpRouteUIState[d.dataset.routeKey];
                    if (!state) return;
                    if (state.open) d.open = true;
                    if (state.showAll) {
                        var btn = d.querySelector('.show-all-btn');
                        if (btn) showAllRoutes(btn);
                    }
                });
            }
        });

        function closeModal() {
            var container = document.getElementById('modal-container');
            var dialog = container.querySelector('dialog');
            if (dialog) {
                dialog.close();
            }
            container.innerHTML = '';
        }

        function toggleExitNodeFields(checkbox) {
            var routeVia = document.getElementById('route-via-field');
            var exitConfig = document.getElementById('exit-node-config');

            if (routeVia) {
                routeVia.style.display = checkbox.checked ? 'none' : '';
            }
            if (exitConfig) {
                exitConfig.style.display = checkbox.checked ? '' : 'none';
            }
        }

        function toggleExitNodeRoutes(checkbox) {
            var routesField = document.getElementById('exit-node-routes-field');
            if (routesField) {
                routesField.style.display = checkbox.checked ? 'none' : '';
            }
        }

        function toggleBGPSettings(checkbox) {
            var bgpSettings = document.getElementById('bgp-settings-config');
            if (bgpSettings) {
                bgpSettings.style.display = checkbox.checked ? '' : 'none';
            }
        }

        function showAllRoutes(btn) {
            btn.style.display = 'none';
            var details = btn.closest('details');
            details.dataset.showAll = '1'; // survives the next poll swap, see htmx:beforeSwap/afterSwap above
            details.querySelectorAll('.hidden-route').forEach(function (row) {
                row.classList.remove('hidden-route');
            });
        }

        // containerId/namePrefix let the same form host two independent filter
        // lists (received vs. advertised prefixes) without their rows colliding.
        function addRouteFilterRow(containerId, namePrefix) {
            containerId = containerId || 'bgp-route-filters-list';
            namePrefix = namePrefix || 'filter';
            var list = document.getElementById(containerId);
            if (!list) return;

            var div = document.createElement('div');
            div.className = 'route-filter-row';
            div.style.cssText = 'display:flex; gap:0.5rem; margin-bottom:0.5rem;';
            div.innerHTML = `
                <input type="text" name="${namePrefix}Prefix[]" value="" placeholder="Prefix (e.g. 10.1.0.0/16)" style="flex:1">
                <select name="${namePrefix}Matcher[]" style="width:auto">
                    <option value="exact">Exact</option>
                    <option value="orlonger">Or Longer</option>
                </select>
                <select name="${namePrefix}Action[]" style="width:auto">
                    <option value="accept">Accept</option>
                    <option value="reject">Reject</option>
                </select>
                <button type="button" class="btn btn-outline-danger" style="width:auto" onclick="this.closest('.route-filter-row').remove()">X</button>
            `;
            list.appendChild(div);
        }

    </script>
</body>

</html>
