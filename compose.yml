services:
  wg-busy:
    build: .
    image: wg-busy:latest
    container_name: wg-busy
    security_opt:
      - systempaths=unconfined
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun # ZeroTier creates its interfaces through here
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    ports:
      - "11179:11179/tcp" # BGP
      - "8080:8080" # Web UI
      - "51820:51820/udp" # WireGuard
      - "9993:9993/udp" # ZeroTier
    volumes:
      - $PWD/data:/app/data # config.yaml persistence
      - /lib/modules:/lib/modules:ro # kernel modules for wireguard
    # Paths and ports come from the image's CMD flags; the app reads no env vars.
    restart: unless-stopped
